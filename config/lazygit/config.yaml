keybinding:
  universal:
    return: '<c-x>'
gui:
  theme:
    inactiveBorderColor:
    - cyan
    activeBorderColor:
    - magenta
    - bold

customCommands:
  - key: '<c-p>'
    command: 'git push origin HEAD:refs/for/{{.CheckedOutBranch.Name}}'
    context: 'commits'
    stream: true
    loadingText: 'Pushing to remote branch...'
    description: 'Custom: Do git push origin HEAD:refs/for/...'
    - key: '<c-p>'
    command: 'git pull --rebase'
    context: 'localBranches'
    stream: true
    loadingText: 'Pulling then rebase'
    description: 'Custom: Do git pull --rebase'
    - key: '<c-f>'
    command: 'git fetch'
    context: 'localBranches'
    stream: true
    loadingText: 'Fetching...'
    description: 'Custom: Do git fetch'
